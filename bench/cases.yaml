# Benchmark matrix.
#
# This file was committed before any kernel tuning and has only been added to
# since, never narrowed, so the reported results cannot be a cherry-picked
# subset. Every case here appears in bench/results/*.json for every provider,
# including providers that were unavailable (status "unsupported") or crashed
# (status "failed").
#
# Timing: triton.testing.do_bench, 25 ms warm-up, at least 100 measured
# iterations per record, median and interquartile range reported, all raw
# replicates stored. torch.compile compilation time is recorded separately.
# Details: docs/benchmarking.md

rmsnorm:
  providers: [kiln, eager, torch_compile, liger]
  core:
    dtypes: [float16, bfloat16]
    # M = rows (batch * sequence), N = hidden size
    M: [1, 16, 256, 4096, 16384]
    N: [1024, 4096, 8192]
    modes: [fwd, fwd_bwd]
  stress:
    - {dtype: float16, M: 2048, N: 3000, modes: [fwd, fwd_bwd]}   # non-power-of-2 hidden size
    - {dtype: float16, M: 2048, N: 8191, modes: [fwd, fwd_bwd]}   # 2^n - 1: worst case for masking
    - {dtype: float32, M: 4096, N: 4096, modes: [fwd, fwd_bwd]}
    - {dtype: float16, M: 1,    N: 8192, modes: [fwd]}            # latency floor
    - {dtype: float16, M: 65536, N: 1024, modes: [fwd]}           # many small rows

sampling:
  providers: [kiln, eager_hf_chain, torch_compile_hf_chain, vllm_sampler]
  # vLLM was not installable on the benchmark host; its records carry
  # status "unsupported" so the gap is visible rather than silent.
  core:
    dtype: float16
    temperature: 0.8
    B: [1, 32, 256]
    V: [32768, 131072]
    k: [1, 50, 500]
    p: [0.9, 1.0]
  stress:
    - {dtype: float32, B: 256, V: 131072, k: 500, p: 0.9, temperature: 0.8}   # 32-bit keys (hardest search)
    - {dtype: float16, B: 8,   V: 131072, k: 50,  p: 0.9, temperature: 0.8}
    - {dtype: float16, B: 128, V: 32768,  k: 50,  p: 0.9, temperature: 0.8}
    - {dtype: float16, B: 32,  V: 1024,   k: 50,  p: 0.9, temperature: 0.8}   # tiny vocabulary
    - {dtype: float16, B: 32,  V: 131072, k: 131072, p: 1.0, temperature: 1.0} # both filters disabled: pure softmax
    - {dtype: float16, B: 32,  V: 131072, k: 1,   p: 0.9, temperature: 0.05}  # extreme temperature
